[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "secret-scanner-cl"
version = "1.1.0"
description = "Local-first CLI, pre-commit hook and MCP server for detecting hardcoded secrets."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Kiara Zapana" }]
keywords = ["security", "secrets", "devsecops", "pre-commit", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "colorama>=0.4.6,<1",
    "mcp>=1.0.0,<2",
    "tomli>=2,<3; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "build>=1.2,<2",
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "ruff>=0.8,<1",
    "twine>=5,<8",
]

[project.urls]
Homepage = "https://github.com/Kiara1616/secretscanner"
Documentation = "https://github.com/Kiara1616/secretscanner#readme"
Repository = "https://github.com/Kiara1616/secretscanner"
Issues = "https://github.com/Kiara1616/secretscanner/issues"
Changelog = "https://github.com/Kiara1616/secretscanner/blob/main/CHANGELOG.md"

[project.scripts]
secret-scanner = "secret_scanner.main:main"
secret-scanner-mcp = "secret_scanner.mcp_server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--cov=secret_scanner.scanner", "--cov-report=term-missing", "--cov-report=xml", "--cov-fail-under=80"]

[tool.coverage.run]
source = ["src/secret_scanner/scanner"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 80

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
