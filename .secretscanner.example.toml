# Copy this file to .secretscanner.toml and adapt it to your project.

[scan]
exclude_paths = [
  "vendor/**",
  "docs/generated/**",
]

[allowlist]
# Use paths for known fixtures and regex patterns only for intentionally fake values.
paths = ["tests/fixtures/**"]
patterns = ["EXAMPLE_ONLY_[A-Z0-9]+"]
fingerprints = []

[baseline]
# Commit this file when the team intentionally accepts existing findings.
path = ".secretscanner-baseline.json"
